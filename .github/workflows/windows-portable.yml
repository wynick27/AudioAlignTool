name: Build Windows portable package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 120
    concurrency:
      group: windows-portable-${{ github.ref }}
      cancel-in-progress: true
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: portable
            build_args: ""
          - flavor: standard
            build_args: "-Standard"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Failed to upgrade pip." }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to install locked build dependencies." }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw "Failed to install AudioAlignTool." }
          python -c "import numpy, PySide6, av, faster_whisper, markdown_it; from PySide6 import QtWebChannel, QtWebEngineCore, QtWebEngineWidgets; print('Base runtime import check passed')"
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency import check failed." }

      - name: Select package version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cannot read project version" }
          $version = $match.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event_name }}" -eq "pull_request") {
            $version = "${version}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          } else {
            $version = "${version}-ci.${{ github.run_number }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows package
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          if ("${{ matrix.flavor }}" -eq "standard") {
            python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
            if ($LASTEXITCODE -ne 0) { throw "Failed to install CPU-only PyTorch." }
            python -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
            if ($LASTEXITCODE -ne 0) { throw "Standard package unexpectedly contains CUDA PyTorch." }
            python -m pip install -r requirements-qwen-lock.txt
            if ($LASTEXITCODE -ne 0) { throw "Failed to install Qwen dependencies." }
            .\build-portable.ps1 -Python $python -Version "${{ steps.version.outputs.value }}" -SkipInstall -SkipTests -Clean -Standard
          } else {
            .\build-portable.ps1 -Python $python -Version "${{ steps.version.outputs.value }}" -SkipInstall -SkipTests -Clean
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AudioAlignTool-${{ steps.version.outputs.value }}-Windows-x64-${{ matrix.flavor }}
          path: |
            artifacts/AudioAlignTool-*-Windows-x64-${{ matrix.flavor }}.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: windows-package
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AudioAlignTool-*-Windows-x64-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          sha256sum release-assets/AudioAlignTool-*-Windows-x64-*.zip > release-assets/SHA256SUMS.txt
          assets=(release-assets/AudioAlignTool-*-Windows-x64-*.zip release-assets/SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --generate-notes --title "AudioAlignTool ${tag#v}"
          fi
