[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-align-tool"
version = "0.1.0"
description = "Offline multilingual ebook and audiobook alignment editor"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.8",
  "pyqtgraph>=0.13.7",
  "av>=13.0",
  "faster-whisper>=1.2.1",
  "huggingface-hub>=0.34,<1.0",
  "qwen-asr==0.0.6",
  "modelscope>=1.33",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
align = ["whisperx>=3.3"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
audio-align-tool = "audioalign.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
